<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta http-equiv="refresh" content="2;url=/923hy?site-data-cleared=1" />
    <title>Refreshing O1SF</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #17172b;
        background: #f6f8fb;
      }
      main {
        width: min(100%, 460px);
        padding: 32px 24px;
        text-align: center;
        background: #fff;
        border: 1px solid #44368e24;
        border-radius: 18px;
      }
      .mark {
        display: grid;
        width: 52px;
        height: 52px;
        margin: 0 auto 18px;
        place-items: center;
        color: #fff;
        font-weight: 800;
        background: #246bfe;
        border-radius: 8px;
      }
      h1 { margin: 0; font-size: clamp(1.6rem, 7vw, 2.25rem); line-height: 1.08; }
      p { margin: 14px auto 0; color: #393950; line-height: 1.55; }
      a {
        display: inline-grid;
        min-height: 48px;
        margin-top: 22px;
        padding: 0 22px;
        align-content: center;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
        background: #246bfe;
        border-radius: 999px;
      }
      a:focus-visible { outline: 3px solid rgba(36, 107, 254, 0.3); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">O1</div>
      <h1>Site data cleared</h1>
      <p>The cache and saved data for o1sf.com were removed from this browser. Opening a fresh copy of the demo…</p>
      <a href="/923hy?site-data-cleared=1">Return to the demo</a>
    </main>
  </body>
</html>
